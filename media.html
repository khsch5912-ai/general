<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <title>Медиатека — Khanbaliya</title>
    <link rel="shortcut icon" href="images/Круглая-каллиграфическая-печать-Ханбалитской-школы.ico" type="image/x-icon">
    <link rel="stylesheet" href="media.css">
</head>
<body data-view="home">

<header class="topbar">
    <a class="brand" href="index.html">Khanbaliya</a>
    <nav>
        <a href="index.html">Главная</a>
        <a href="#" class="active">Медиатека</a>
    </nav>
</header>

<main id="app">

    <!-- Загрузка / ошибка -->
    <section id="boot" class="boot" aria-live="polite">
        <div class="spinner" id="boot-spinner"></div>
        <p id="boot-text">Загружаем уроки…</p>
        <button id="boot-retry" class="btn" hidden>Повторить</button>
    </section>

    <!-- ГЛАВНАЯ: книги -->
    <section id="view-home" hidden>
        <div class="hero">
            <h1>Media Library</h1>
            <p>Аудиоуроки по книгам ханбалитского фикха</p>
        </div>
        <div id="continue"></div>
        <label class="search">
            <span data-icon="search"></span>
            <input id="search" type="search" placeholder="Найти книгу или урок" autocomplete="off">
        </label>
        <div id="books" class="grid"></div>
        <div id="hits"></div>
        <p class="note-vpn">Если аудио не загружается — попробуйте VPN.</p>
    </section>

    <!-- КНИГА: список частей -->
    <section id="view-book" hidden>
        <a class="back" href="#"><span data-icon="chevron-left"></span>Все книги</a>
        <div id="book-head" class="book-head"></div>
        <label class="search" id="book-search-wrap" hidden>
            <span data-icon="search"></span>
            <input id="book-search" type="search" placeholder="Найти часть" autocomplete="off">
        </label>
        <div id="book-lessons" class="list"></div>
    </section>

    <!-- УРОК: плеер + заметки -->
    <section id="view-lesson" hidden>
        <a class="back" id="lesson-back" href="#"><span data-icon="chevron-left"></span><span id="lesson-back-text">Назад</span></a>
        <div class="lesson-grid">

            <div class="player card">
                <div class="cover cover--lg" id="lp-cover"><span id="lp-letter"></span></div>
                <div class="now">
                    <div class="eyebrow" id="lp-eyebrow"></div>
                    <h1 id="lp-title"></h1>
                    <div class="muted" id="lp-book"></div>
                </div>

                <div class="seekrow">
                    <input id="seek" type="range" min="0" max="0" step="any" value="0" aria-label="Перемотка">
                    <div class="times"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>
                </div>

                <div class="transport">
                    <button id="btn-prev" class="ic" aria-label="Предыдущая часть" title="Предыдущая часть"><span data-icon="prev"></span></button>
                    <button id="btn-back" class="ic" aria-label="Назад на 15 секунд" title="Назад 15 с"><span data-icon="back15"></span></button>
                    <button id="btn-play" class="play" aria-label="Играть"><span class="i-play" data-icon="play"></span><span class="i-pause" data-icon="pause"></span></button>
                    <button id="btn-fwd" class="ic" aria-label="Вперёд на 15 секунд" title="Вперёд 15 с"><span data-icon="fwd15"></span></button>
                    <button id="btn-next" class="ic" aria-label="Следующая часть" title="Следующая часть"><span data-icon="next"></span></button>
                </div>

                <div class="chips">
                    <button id="btn-speed" class="chip" title="Скорость">1×</button>
                    <button id="btn-sleep" class="chip" title="Таймер сна"><span data-icon="moon"></span><span id="sleep-label">Таймер сна</span></button>
                    <button id="btn-auto" class="chip" aria-pressed="true" title="Автоматически включать следующую часть">Авто-следующая</button>
                </div>
            </div>

            <div class="side card">
                <div class="tabs" role="tablist">
                    <button role="tab" data-tab="notes" aria-selected="true">Заметки</button>
                    <button role="tab" data-tab="parts" aria-selected="false">Части</button>
                </div>

                <div class="panel" data-panel="notes">
                    <div class="note-tools">
                        <button id="btn-time" class="chip" title="Вставить текущее время"><span data-icon="clock"></span>Таймкод</button>
                        <button id="btn-bold" class="chip" aria-label="Жирный"><b>B</b></button>
                        <button id="btn-italic" class="chip" aria-label="Курсив"><i>I</i></button>
                        <select id="font-select" aria-label="Шрифт заметок">
                            <option value="'Tilda', system-ui, sans-serif">Обычный</option>
                            <option value="Georgia, 'Times New Roman', serif">С засечками</option>
                            <option value="ui-monospace, Menlo, Consolas, monospace">Моноширинный</option>
                        </select>
                    </div>
                    <textarea id="note-text" placeholder="Пишите заметки по ходу урока. Таймкод привязывает мысль к моменту в записи."></textarea>
                    <div class="note-foot">
                        <span id="note-status" class="muted"></span>
                        <span class="spacer"></span>
                        <button id="btn-export" class="chip"><span data-icon="download"></span>Экспорт .txt</button>
                        <button id="btn-clear" class="chip danger"><span data-icon="trash"></span>Очистить</button>
                    </div>
                    <div id="note-preview-wrap" hidden>
                        <h3>Просмотр (таймкоды кликабельны)</h3>
                        <div id="note-preview"></div>
                    </div>
                </div>

                <div class="panel" data-panel="parts" hidden>
                    <div id="side-lessons" class="list"></div>
                </div>
            </div>

        </div>
    </section>
</main>

<footer class="foot" id="foot">
    <span>Остались вопросы?</span>
    <a href="https://t.me/hanbaly_bot">Telegram-бот</a>
    <a href="https://t.me/khanabilya_0">Telegram-канал</a>
</footer>

<!-- Мини-плеер: виден на всех экранах, кроме страницы урока -->
<div id="mini" hidden>
    <div class="mini-bar"><i id="mini-bar"></i></div>
    <div class="mini-body" id="mini-open" role="button" tabindex="0" aria-label="Открыть плеер">
        <div class="cover cover--sm" id="mini-cover"><span id="mini-letter"></span></div>
        <div class="mini-text">
            <div class="mini-title" id="mini-title"></div>
            <div class="muted" id="mini-book"></div>
        </div>
        <button id="mini-play" class="mini-btn" aria-label="Играть"><span class="i-play" data-icon="play"></span><span class="i-pause" data-icon="pause"></span></button>
    </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<audio id="audio" preload="metadata"></audio>
<script src="app.js"></script>
</body>
</html>
